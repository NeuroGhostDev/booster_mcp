[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Booster-mcp"
version = "3.1.0"
description = "Cognitive Runtime for AI coding agents: repo maps, code graphs, git intelligence, diagnostics, memory, and validation loops"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "NeuroGhostDev" }]
keywords = [
    "mcp",
    "code-analysis",
    "semantic-search",
    "coding-agents",
    "code-intelligence",
    "diagnostics",
    "validation-loop",
    "ai",
    "llm",
    "tree-sitter",
    "faiss",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=0.1.0",
    "tree-sitter>=0.25.0",
    "watchdog>=4.0.0",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.0.0",
    "numpy>=1.24.0",
    "rank-bm25>=0.2.2",
    "grep-ast>=0.9.0",
    "tree-sitter-language-pack>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/NeuroGhostDev/Booster-mcp"
Repository = "https://github.com/NeuroGhostDev/Booster-mcp.git"
Issues = "https://github.com/NeuroGhostDev/Booster-mcp/issues"

[project.scripts]
Booster-mcp = "server:main"
booster = "cli:main"

[tool.setuptools]
py-modules = [
    "chunker",
    "city_server",
    "cli",
    "cognitive_runtime",
    "control",
    "context7_bridge",
    "context_provider",
    "embedder",
    "flipchart",
    "graphs",
    "indexer",
    "parser_router",
    "repomap",
    "repository_scanner",
    "server",
    "skill_installer",
    "toolkit",
    "vector_index",
    "visualizer",
    "watcher",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
