<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Booster architecture pipeline</title>
  <desc id="desc">An AI coding agent sends a request through Booster MCP and Booster Home to a model backend. Repository intelligence, git history, diagnostics, and research state feed the runtime.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#101936"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d6ff"/>
      <stop offset="1" stop-color="#7df7d4"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a98bff"/>
      <stop offset="1" stop-color="#ff78d1"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5de8dc"/>
    </marker>
    <marker id="arrow-violet" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d19aff"/>
    </marker>
  </defs>
  <rect width="1200" height="470" rx="24" fill="url(#bg)"/>
  <g opacity="0.16" stroke="#8da8d8" stroke-width="1">
    <path d="M0 82H1200 M0 162H1200 M0 242H1200 M0 322H1200 M0 402H1200"/>
    <path d="M80 0V470 M200 0V470 M320 0V470 M440 0V470 M560 0V470 M680 0V470 M800 0V470 M920 0V470 M1040 0V470"/>
  </g>
  <text x="56" y="54" fill="#eaf3ff" font-size="25" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">Booster perception layer</text>
  <text x="56" y="80" fill="#91a8ca" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">Retrieve the smallest useful context before the agent edits code.</text>

  <g filter="url(#glow)">
    <rect x="55" y="135" width="205" height="112" rx="16" fill="#10233b" stroke="#4fddeb" stroke-width="2"/>
    <rect x="315" y="135" width="250" height="112" rx="16" fill="#111f42" stroke="#a98bff" stroke-width="2"/>
    <rect x="620" y="118" width="285" height="146" rx="16" fill="#102c3a" stroke="#5de8dc" stroke-width="2"/>
    <rect x="960" y="135" width="185" height="112" rx="16" fill="#281b3d" stroke="#ff8bd9" stroke-width="2"/>
  </g>

  <g fill="#f2f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="157" y="169" font-size="19" font-weight="700">Coding agent</text>
    <text x="157" y="197" font-size="14" fill="#a9c6e9">VS Code / MCP client</text>
    <text x="157" y="220" font-size="13" fill="#7fe6e0">task + working context</text>

    <text x="440" y="169" font-size="19" font-weight="700">Booster MCP</text>
    <text x="440" y="197" font-size="14" fill="#c9b8ff">repo map + graphs</text>
    <text x="440" y="220" font-size="13" fill="#c9b8ff">memory + diagnostics</text>

    <text x="762" y="155" font-size="20" font-weight="700">Booster Home</text>
    <text x="762" y="184" font-size="14" fill="#9df7df">context compiler</text>
    <text x="762" y="207" font-size="14" fill="#9df7df">session memory + artifacts</text>
    <text x="762" y="230" font-size="14" fill="#9df7df">OpenAI-compatible gateway</text>

    <text x="1052" y="169" font-size="19" font-weight="700">Model backend</text>
    <text x="1052" y="197" font-size="14" fill="#ffc2ec">LM Studio / vLLM</text>
    <text x="1052" y="220" font-size="13" fill="#ffc2ec">local or remote</text>
  </g>

  <g fill="none" stroke-width="3" filter="url(#glow)">
    <path d="M260 191H315" stroke="url(#cyan)" marker-end="url(#arrow-cyan)"/>
    <path d="M565 191H620" stroke="url(#violet)" marker-end="url(#arrow-violet)"/>
    <path d="M905 191H960" stroke="url(#cyan)" marker-end="url(#arrow-cyan)"/>
  </g>

  <g fill="#0d2035" stroke="#6687b8" stroke-width="1.5">
    <rect x="94" y="348" width="190" height="64" rx="12"/>
    <rect x="334" y="348" width="190" height="64" rx="12"/>
    <rect x="574" y="348" width="190" height="64" rx="12"/>
    <rect x="814" y="348" width="190" height="64" rx="12"/>
  </g>
  <g fill="#d9e8ff" font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="189" y="375" font-size="15" font-weight="700">Repository intelligence</text>
    <text x="189" y="396" font-size="12" fill="#8faed6">symbols, imports, calls</text>
    <text x="429" y="375" font-size="15" font-weight="700">Git history</text>
    <text x="429" y="396" font-size="12" fill="#8faed6">commits, blame, intent</text>
    <text x="669" y="375" font-size="15" font-weight="700">Validation</text>
    <text x="669" y="396" font-size="12" fill="#8faed6">types, lint, tests, security</text>
    <text x="909" y="375" font-size="15" font-weight="700">Research state</text>
    <text x="909" y="396" font-size="12" fill="#8faed6">metrics, evidence, artifacts</text>
  </g>
  <g fill="none" stroke="#6f94c5" stroke-width="2" stroke-dasharray="6 7">
    <path d="M189 348V286H440V247" marker-end="url(#arrow-violet)"/>
    <path d="M429 348V286H440V247" marker-end="url(#arrow-violet)"/>
    <path d="M669 348V286H762V264" marker-end="url(#arrow-cyan)"/>
    <path d="M909 348V286H762V264" marker-end="url(#arrow-cyan)"/>
  </g>
</svg>
